name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/supertonic-narration-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static site to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Prepare static site files
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css asmaul-husna.js app.js dist/
          test -s dist/index.html
          test -s dist/app.js
          echo "Prepared $(find dist -maxdepth 1 -type f | wc -l) static files."

      - name: Ensure Cloudflare Pages project exists
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: asmaul-husna-studio
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}"
          status="$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$api")"

          if [[ "$status" == "200" ]] && jq -e '.success == true' /tmp/cf-project.json >/dev/null; then
            echo "Cloudflare Pages project already exists."
          elif [[ "$status" == "404" ]]; then
            echo "Cloudflare Pages project not found; creating it."
            create_status="$(curl -sS -o /tmp/cf-create-project.json -w '%{http_code}' \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg name "$CF_PROJECT_NAME" --arg branch "main" '{name:$name,production_branch:$branch}')")"
            if [[ "$create_status" != "200" && "$create_status" != "201" ]] || ! jq -e '.success == true' /tmp/cf-create-project.json >/dev/null; then
              cat /tmp/cf-create-project.json
              echo "Cloudflare Pages project creation failed (HTTP $create_status)." >&2
              exit 1
            fi
            echo "Cloudflare Pages project created."
          else
            cat /tmp/cf-project.json
            echo "Could not inspect Cloudflare Pages project (HTTP $status)." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish branch deployment
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: asmaul-husna-studio
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CF_BRANCH="$(printf '%s' "$SOURCE_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | sed 's/--*/-/g' | cut -c1-28)"
          if [[ -z "$CF_BRANCH" ]]; then
            echo "Could not derive a Cloudflare Pages branch name." >&2
            exit 1
          fi
          npx --yes wrangler@4 pages deploy ./dist \
            --project-name="$CF_PROJECT_NAME" \
            --branch="$CF_BRANCH"
