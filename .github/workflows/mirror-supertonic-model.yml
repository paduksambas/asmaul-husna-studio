name: Mirror Supertonic 3 model to GitHub Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mirror-supertonic-model.yml"

permissions:
  contents: write

concurrency:
  group: supertonic3-model-release
  cancel-in-progress: false

jobs:
  mirror-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download complete model snapshot
        run: |
          python -m pip install --upgrade huggingface_hub
          hf download open-world-group/Supertonic-3-ONNX --repo-type model --local-dir model-bundle
          test -d model-bundle
          test "$(find model-bundle -type f | wc -l)" -gt 0
          du -sh model-bundle

      - name: Package model and generate checksum
        run: |
          tar -czf supertonic-3-onnx-model.tar.gz -C model-bundle .
          test -s supertonic-3-onnx-model.tar.gz
          test "$(stat -c%s supertonic-3-onnx-model.tar.gz)" -lt 2147483648
          sha256sum supertonic-3-onnx-model.tar.gz > supertonic-3-onnx-model.tar.gz.sha256
          ls -lh supertonic-3-onnx-model.tar.gz supertonic-3-onnx-model.tar.gz.sha256

      - name: Publish or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="supertonic3-model-v1"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" supertonic-3-onnx-model.tar.gz supertonic-3-onnx-model.tar.gz.sha256 --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" supertonic-3-onnx-model.tar.gz supertonic-3-onnx-model.tar.gz.sha256 \
              --title "Supertonic 3 ONNX model bundle" \
              --notes "Backup mirror for Asmaul Husna Studio. Source: open-world-group/Supertonic-3-ONNX. Includes upstream model files and license. Verify the archive with the accompanying SHA-256 file. Model use remains subject to the included OpenRAIL-M license." \
              --repo "${{ github.repository }}"
          fi
