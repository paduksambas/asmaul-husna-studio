name: Mirror Supertonic 3 model to GitHub Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mirror-supertonic-model.yml"

permissions:
  contents: write

concurrency:
  group: supertonic3-model-release
  cancel-in-progress: false

jobs:
  mirror-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download complete model snapshot
        run: |
          python -m pip install --upgrade huggingface_hub
          hf download open-world-group/Supertonic-3-ONNX --repo-type model --local-dir model-bundle
          test -d model-bundle
          test "$(find model-bundle -type f | wc -l)" -gt 0
          du -sh model-bundle

      - name: Validate ONNX and voice assets are real files, not Git LFS pointers
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path("model-bundle")
          pointer_prefix = b"version https://git-lfs.github.com/spec/v1"
          files = [p for p in root.rglob("*") if p.is_file()]
          onnx_files = [p for p in files if p.suffix.lower() == ".onnx"]

          if not onnx_files:
              sys.exit("ERROR: no .onnx model files found in downloaded snapshot")

          pointer_files = []
          for path in files:
              if path.suffix.lower() not in {".onnx", ".bin", ".json"}:
                  continue
              with path.open("rb") as f:
                  header = f.read(256)
              if header.startswith(pointer_prefix):
                  pointer_files.append(path)

          if pointer_files:
              for path in pointer_files:
                  print(f"Git LFS pointer detected: {path} ({path.stat().st_size} bytes)")
              sys.exit("ERROR: model snapshot contains Git LFS pointer text instead of asset data")

          print(f"Validated {len(onnx_files)} ONNX files:")
          for path in onnx_files:
              print(f"  {path.relative_to(root)} — {path.stat().st_size:,} bytes")
          print(f"Total snapshot files: {len(files)}")
          PY

      - name: Inspect official model configs and ONNX graph interfaces
        run: |
          python -m pip install --upgrade onnx
          python - <<'PY'
          from pathlib import Path
          import json
          import onnx

          root = Path("model-bundle")
          readme = root / "README.md"
          if readme.exists():
              print("=== UPSTREAM MODEL README ===")
              print(readme.read_text(encoding="utf-8")[:20000])

          print("=== SNAPSHOT FILE INVENTORY ===")
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              print(f"{path.relative_to(root)}\t{path.stat().st_size}")

          print("\\n=== JSON CONFIGURATION FILES ===")
          for path in sorted(root.rglob("*.json")):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  print(f"--- {path.relative_to(root)} ---")
                  print(json.dumps(value, ensure_ascii=False, indent=2)[:12000])
              except Exception as exc:
                  print(f"Could not parse {path}: {exc}")

          def shape(value):
              dims = []
              for dim in value.type.tensor_type.shape.dim:
                  dims.append(dim.dim_param or dim.dim_value or "?")
              return dims

          print("\\n=== ONNX MODEL INTERFACES ===")
          for path in sorted(root.rglob("*.onnx")):
              model = onnx.load(str(path), load_external_data=False)
              print(f"--- {path.relative_to(root)} ---")
              print(f"producer={model.producer_name} version={model.producer_version}")
              print("inputs:", json.dumps([
                  {"name": x.name, "shape": shape(x), "type": x.type.tensor_type.elem_type}
                  for x in model.graph.input
              ]))
              print("outputs:", json.dumps([
                  {"name": x.name, "shape": shape(x), "type": x.type.tensor_type.elem_type}
                  for x in model.graph.output
              ]))
              print(f"nodes={len(model.graph.node)} opsets={[(x.domain, x.version) for x in model.opset_import]}")
          PY

      - name: Smoke-test official Transformers.js Arabic synthesis
        run: |
          npm init -y
          npm install --no-save @huggingface/transformers
          npm install-scripts approve onnxruntime-node
          npm install-scripts approve protobufjs
          npm rebuild onnxruntime-node protobufjs
          node scripts/test-supertonic-tts.mjs

      - name: Package model and generate checksum
        run: |
          tar -czf supertonic-3-onnx-model.tar.gz -C model-bundle .
          test -s supertonic-3-onnx-model.tar.gz
          test "$(stat -c%s supertonic-3-onnx-model.tar.gz)" -lt 2147483648
          sha256sum supertonic-3-onnx-model.tar.gz > supertonic-3-onnx-model.tar.gz.sha256
          ls -lh supertonic-3-onnx-model.tar.gz supertonic-3-onnx-model.tar.gz.sha256

      - name: Publish or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="supertonic3-model-v1"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" supertonic-3-onnx-model.tar.gz supertonic-3-onnx-model.tar.gz.sha256 --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" supertonic-3-onnx-model.tar.gz supertonic-3-onnx-model.tar.gz.sha256 \
              --title "Supertonic 3 ONNX model bundle" \
              --notes "Backup mirror for Asmaul Husna Studio. Source: open-world-group/Supertonic-3-ONNX. Includes upstream model files and license. Verify the archive with the accompanying SHA-256 file. Model use remains subject to the included OpenRAIL-M license." \
              --repo "${{ github.repository }}"
          fi
